<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediLink - Register</title>

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card register-card">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                +
            </div>

            <h1>MediLink</h1>

            <p>
                Smart Healthcare System
            </p>

        </div>


        <div class="auth-title">

            <h2>Create Account</h2>

            <p>
                Create your MediLink account
            </p>

        </div>


        <form
            action="/register"
            method="POST"
        >

            <div class="form-row">

                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="First name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Last name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        required
                    >

                    I agree to the MediLink
                    <a href="#">
                        Terms and Conditions
                    </a>

                </label>

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            OR
        </div>


        <div class="create-account">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
