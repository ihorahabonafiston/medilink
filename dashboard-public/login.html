<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediLink - Login</title>

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="auth-logo-icon">
                +
            </div>

            <h1>MediLink</h1>

            <p>
                Smart Healthcare System
            </p>

        </div>


        <div class="auth-title">

            <h2>Welcome Back</h2>

            <p>
                Sign in to your MediLink account
            </p>

        </div>


        <form
            action="/login"
            method="POST"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            OR
        </div>


        <div class="create-account">

            Don't have an account?

            <a href="/register.html">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
